name: Godot combat tests
on:
  push:
    branches: [main, feature/skills-two-encounters]
  pull_request:

jobs:
  godot-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download Godot 4.7.2
        run: |
          curl -fL --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp
          chmod +x /tmp/Godot_v4.7.2-stable_linux.x86_64
      - name: Import and parse project
        run: /tmp/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --editor --quit
      - name: Run game rules tests
        run: /tmp/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script res://tests/test_battle_model.gd
      - name: Run draft screen smoke test
        run: timeout 45s /tmp/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script res://tests/test_battle_screen.gd

      - name: Run transparent combat log tests
        run: /tmp/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script res://tests/test_combat_log.gd